<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ian Taylor | Software Engineer</title>
    <meta
      name="description"
      content="Ian Taylor is a Los Angeles-based software engineer building game tools for Wowhead with React and TypeScript."
    />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://itaylorcodes.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://itaylorcodes.com/" />
    <meta property="og:title" content="Ian Taylor | Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building game tools for Wowhead with React and TypeScript."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/it-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
